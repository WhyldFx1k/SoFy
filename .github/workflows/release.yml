name: Release

on:
  push:
    tags:
      - 'v*.*.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+)\.(\d+)\.0$') {
            throw "Release tags must look like v<major>.<minor>.0, got $tag"
          }
          if ([int]$Matches[2] -lt 1) {
            throw "Releases are published only when the minor version changes (x.Y.0)"
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match package.json version $version"
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - run: npm ci

      - run: npm run dist:win

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @(
            "release/SoFy-Setup-$version.exe",
            "release/SoFy-Setup-$version.exe.blockmap",
            "release/SoFy-Portable-$version.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing artifact: $file" }
          }
          $existing = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} already exists, skipping"
          } else {
            gh release create "${{ github.ref_name }}" $files --repo "${{ github.repository }}" --title "SoFy $version" --generate-notes
          }
